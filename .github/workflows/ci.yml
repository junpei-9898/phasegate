name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Coverage configs execute the forks and threads unit/integration suites
      # once and emit coverage/coverage-summary.json for L3-003. E2E is excluded
      # from coverage to avoid ci-check/report circularity, so run only that
      # excluded suite afterward instead of repeating the full plain test suite.
      - name: Test and generate coverage
        run: |
          pnpm coverage
          pnpm exec vitest run --config scripts/harness/__tests__/vitest.config.ts --dir scripts/harness/__tests__/e2e

      # L3-004 (AC-coverage) reads .harness/requirement-test-matrix.json, a
      # git-ignored GENERATED artifact. Regenerate it from the current tests
      # BEFORE running the phasegate CI check so L3-004 validates fresh data.
      - name: Generate requirement-test matrix
        run: npx tsx scripts/harness/main.ts phasegate:generate-matrix

      # World reports are derived outputs, never CI inputs. Run the pure command
      # twice against the same checkout and matrix to pin byte determinism before
      # the authoritative L3 re-derivation.
      - name: World derive determinism (dogfood)
        run: |
          set -euo pipefail
          FIRST="$RUNNER_TEMP/world-derive-${{ matrix.node-version }}-first.json"
          SECOND="$RUNNER_TEMP/world-derive-${{ matrix.node-version }}-second.json"
          npx tsx scripts/harness/main.ts world:derive --json > "$FIRST"
          npx tsx scripts/harness/main.ts world:derive --json > "$SECOND"
          cmp --silent "$FIRST" "$SECOND"

      - name: Phasegate CI check (L3 incl. L3-004)
        run: npx tsx scripts/harness/main.ts phasegate:ci-check --json

      # Produce v2 evidence only after tests, matrix, World derivation, and L3
      # have passed. Keep the generated record in runner temp, then verify the
      # exact bytes that would be handed to a downstream evidence consumer.
      - name: Produce and verify Phasegate attestation v2
        run: |
          set -euo pipefail
          ATTESTATION="$RUNNER_TEMP/phasegate-attestation-${{ matrix.node-version }}.json"
          npx tsx scripts/harness/main.ts phasegate:attest --require-pass --out "$ATTESTATION" --json
          npx tsx scripts/harness/main.ts phasegate:verify-attestation "$ATTESTATION" --json

      # Trust root (ADR-030 §Decision.1): re-compute SHA-256 of instruction-carrying
      # files and compare against the pinned phasegate.integrity.json. Local
      # session-start verification is fast-path only; this CI step is authoritative.
      - name: Phasegate integrity verify (ADR-030 trust root)
        run: npx tsx scripts/harness/main.ts integrity:verify

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm pack
      - name: Verify package size under 5MB
        run: |
          SIZE=$(stat -c%s phasegate-*.tgz)
          echo "Package size: $((SIZE / 1024)) kB"
          if [ "$SIZE" -gt 5242880 ]; then
            echo "::error::Package size exceeds 5MB limit"
            exit 1
          fi
