name: AIDLC Harness Gate

on:
  pull_request:
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "scripts/harness/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  harness-check:
    name: Harness Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run harness checks
        id: harness
        run: |
          npx tsx scripts/harness/cli/ci-check.ts > harness-result.json 2>&1 || true
          cat harness-result.json
          echo "result=$(cat harness-result.json | jq -c .)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Post PR comment on failure
        if: fromJSON(steps.harness.outputs.result).success == false
        uses: actions/github-script@v7
        with:
          script: |
            const result = ${{ steps.harness.outputs.result }};
            const annotations = result.annotations || [];
            const body = [
              '## 🔴 AIDLC Harness Check Failed',
              '',
              `**Errors:** ${result.errorCount} | **Warnings:** ${result.warningCount}`,
              '',
              '| Severity | File | Message |',
              '|----------|------|---------|',
              ...annotations.map(a => `| ${a.annotation_level} | \`${a.path}:${a.start_line}\` | ${a.message} |`),
              '',
              '---',
              '_Fix the issues above and push again._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if errors
        if: fromJSON(steps.harness.outputs.result).success == false
        run: exit 1
