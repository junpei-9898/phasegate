name: AIDLC Consistency Check

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  consistency:
    name: Design-Implementation Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect all source files
        id: files
        run: |
          FILES=$(find backend/src frontend/src -name "*.ts" 2>/dev/null | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run consistency check
        id: check
        run: |
          npx tsx scripts/harness/cli/ci-check.ts --files ${{ steps.files.outputs.files }} > result.json 2>&1 || true
          cat result.json

      - name: Create issue on drift
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            } catch {
              return;
            }
            if (result.success) return;

            const title = `[AIDLC] Design-Implementation Drift Detected (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              '## Design-Implementation Consistency Report',
              '',
              `**Errors:** ${result.errorCount} | **Warnings:** ${result.warningCount}`,
              '',
              'Run `npx tsx scripts/harness/cli/ci-check.ts` locally for details.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['aidlc', 'consistency'],
            });
