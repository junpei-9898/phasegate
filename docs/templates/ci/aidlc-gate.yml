# Phasegate — PR検証ワークフロー
#
# 使い方:
#   phasegate install または ci:generate-template で配置する。
#
# 実行タイミング: Pull Request（open / synchronize / reopen）
# 実行内容:
#   1. bypass:audit — bypass trailer / evidence 監査
#   2. phasegate lint  — L1 Biome AST ルール検証
#   3. package の coverage script を実行し、L3-003 の入力を生成
#   4. requirement-test matrix をcurrent testsから再生成
#   5. world.enabled=true の場合、world:derive を2回実行してbyte一致を検証
#   6. phasegate:ci-check — L3 CI バリデータ（security / performance / coverage / nyquist / World）
#   7. 失敗時: PR にエラーサマリーをコメント

name: AIDLC Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  harness-gate:
    name: Harness Quality Gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # PRコメント書き込みに必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      # Bypass audit: local `git commit --no-verify` can skip hooks, but CI
      # replays the gate over the PR range and requires structured evidence.
      - name: Bypass Audit
        id: bypass_audit
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}" --depth=1
          RESULT=$(npx phasegate bypass:audit --base "origin/${{ github.base_ref }}" --head HEAD 2>&1)
          EXIT_CODE=$?
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # L1: Biome AST ルール
      - name: L1 Lint (Biome AST)
        id: lint
        run: |
          set +e
          RESULT=$(npx phasegate lint --json 2>&1)
          EXIT_CODE=$?
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # L3-003 is fail-closed when coverageThreshold is configured but the
      # report is absent. The adopting project owns this script and must emit
      # coverage/coverage-summary.json; package-manager selection follows the
      # lockfile used during dependency installation above.
      - name: Test and generate coverage
        shell: bash
        run: |
          set -euo pipefail
          node -e "const scripts=require('./package.json').scripts ?? {}; if (!scripts.coverage) { throw new Error('phasegate aidlc-gate requires package.json scripts.coverage to generate coverage/coverage-summary.json'); }"
          if [ -f pnpm-lock.yaml ]; then
            pnpm run coverage
          elif [ -f yarn.lock ]; then
            yarn coverage
          else
            npm run coverage
          fi

      # L3-004 consumes the generated requirement-test matrix. Always rebuild it
      # from this checkout instead of trusting a stale or persisted artifact.
      - name: Generate requirement-test matrix
        if: always()
        run: npx phasegate phasegate:generate-matrix

      # Automatic World integration is selected only by an explicit true value.
      # Missing/false keeps existing projects compatible; invalid JSON is a hard
      # configuration error and must not be laundered into a disabled result.
      - name: Detect World Model enablement
        id: world_config
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ENABLED=$(node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          if (!existsSync('phasegate.config.json')) {
            process.stdout.write('false');
          } else {
            const config = JSON.parse(readFileSync('phasegate.config.json', 'utf8'));
            process.stdout.write(config.world?.enabled === true ? 'true' : 'false');
          }
          NODE
          )
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      - name: World derive determinism
        if: steps.world_config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FIRST="$RUNNER_TEMP/phasegate-world-first.json"
          SECOND="$RUNNER_TEMP/phasegate-world-second.json"
          npx phasegate world:derive --json > "$FIRST"
          npx phasegate world:derive --json > "$SECOND"
          cmp --silent "$FIRST" "$SECOND"

      # L3: CI バリデータ（security / performance / coverage / nyquist）
      - name: L3 CI Check
        id: ci_check
        if: always()
        run: |
          set +e
          RESULT=$(npx phasegate phasegate:ci-check --json 2>&1)
          EXIT_CODE=$?
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      # 失敗時のみ PR にコメント
      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const lintResult   = `${{ steps.lint.outputs.result }}`;
            const ciResult     = `${{ steps.ci_check.outputs.result }}`;
            const bypassResult = `${{ steps.bypass_audit.outputs.result }}`;
            const lintFailed   = '${{ steps.lint.outputs.exit_code }}' !== '0';
            const ciFailed     = '${{ steps.ci_check.outputs.exit_code }}' !== '0';
            const bypassFailed = '${{ steps.bypass_audit.outputs.exit_code }}' !== '0';

            let body = '## ❌ AIDLC Quality Gate — 失敗\n\n';

            if (bypassFailed) {
              body += '### Bypass Audit エラー\n```text\n' + bypassResult + '\n```\n\n';
            }
            if (lintFailed) {
              body += '### L1 Lint エラー\n```json\n' + lintResult + '\n```\n\n';
            }
            if (ciFailed) {
              body += '### L3 CI Check エラー\n```json\n' + ciResult + '\n```\n\n';
            }

            body += '---\n> 修正方法は各 `HarnessError.suggestion` および `HarnessError.fix_example` を参照してください。';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
